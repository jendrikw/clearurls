name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings -Aunknown-lints"
  RUSTDOCFLAGS: "-Dwarnings -Aunknown-lints"

jobs:
  get-msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Set Env
        run: grep rust-version Cargo.toml >> $GITHUB_OUTPUT
  build:
    needs: get-msrv
    strategy:
      matrix:
        channel:
          - stable
          - beta
          - nightly
          - ${{ needs.get-msrv.outputs.rust-version }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust Toolchain
      run: rustup update ${{ matrix.channel }} && rustup default ${{ matrix.channel }} && rustup component add clippy && cargo install cargo-llvm-cov && cargo install cargo-hack --locked
    - name: Build
      run:  cargo hack --feature-powerset build --verbose
    - name: Run tests
      run:  cargo hack --feature-powerset test --verbose
    - name: Coverage
      run:  cargo hack --feature-powerset llvm-cov test --text --verbose
    - name: Build docs
      run: cargo hack --feature-powerset doc --verbose
    - name: Run clippy
      run:  cargo hack --feature-powerset clippy --verbose
      
